plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.hatmod'
base {
    archivesName = 'hatmod-neoforge-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.253'

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        hatmod {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    // Curios 的 API：只用于编译，不会打进成品 jar。
    // 因为构建是 --offline 跑的，这里直接用放在 libs/ 里的 API jar，不去连 maven。
    // 运行时 Curios 是**软依赖**：没装也能正常跑（见 CuriosCompat / HatAbilities.hatStack）。
    compileOnly files('libs/curios-neoforge-9.5.1+1.21.1-api.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
