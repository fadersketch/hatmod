plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.4.1'
group = 'com.hatmod'
base {
    archivesName = 'hatmod-neoforge-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.253'

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        hatmod {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    // Curios 的 API：只用于编译，不会打进成品 jar。
    // 因为构建是 --offline 跑的，这里直接用放在 libs/ 里的 API jar，不去连 maven。
    // 运行时 Curios 是**软依赖**：没装也能正常跑（见 CuriosCompat / HatAbilities.hatStack）。
    compileOnly files('libs/curios-neoforge-9.5.1+1.21.1-api.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    // 破防守护走 Mixin（hatmod.mixins.json），不用 ITransformationService ——
    // 带 services 文件的 jar 会被提前进 PLUGIN/SERVICE 层，那一层看不到 GAME 层的
    // Minecraft 类，注入代码一执行就 NoClassDefFoundError（1.5.202 的坏档根因）。
    manifest {
        attributes([
                'Specification-Title'     : 'hatmod',
                'Specification-Vendor'    : 'HatMod',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'HatMod',
                'MixinConfigs'            : 'hatmod.mixins.json'
        ])
    }
}
