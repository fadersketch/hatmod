[[mods]]
modId="hatmod"
version="1.0.2"
displayName="神之牛仔帽"
logoFile="hatmod_logo.png"
authors="HatMod"
description='''
神之牛仔帽：三顶牛仔帽（黑 / 白 / 红）外加三顶合一的「全」（在工作台把三色合成一顶，附魔全部继承）。
戴上后无法攻击被动生物与未被激怒的中立生物；
合法目标（敌意生物 / 被激怒的中立生物 / 锁定你的生物 / 最近打过你的生物）靠近 16 格即开始蓄力
（三顶帽子的蓄力时长不同，期间自身以外 5 格内一切整体减速），
蓄力结束获得迅捷 II（持续到本轮结束），随后像手电筒一样持续照射正前方，
被照中的敌人每刻受到「按血量算」的伤害并被缓慢 255 定身，照完后重新进入循环。
帽子各有专属效果与专属附魔；「全」同时具备三种专属效果、兼容全部 9 个专属附魔，基础帧伤更高，且自带附魔光效。
'''

[[dependencies.hatmod]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.hatmod]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"

# Curios 是**可选**依赖：装了就把帽子也能放进饰品栏「head」槽并照常生效，
# 没装一切照旧（帽子只认头盔槽）。不装 Curios 时要排在它后面加载。
[[dependencies.hatmod]]
modId="curios"
type="optional"
versionRange="[9.0,)"
ordering="AFTER"
side="BOTH"
